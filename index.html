<!DOCTYPE html>
<!--
================================================================================
  BookTranslationLab — booktranslationlab_v1.0.html
  Version: 1.0   |   Build date: 2026-11-07   |   Owner: Thinkezly (CJ)
--------------------------------------------------------------------------------
  Multi-book translation & publishing management system.
  Single-file HTML app · Firebase Auth (email/password) · Cloud Firestore ·
  Firebase Storage · Netlify hosting via GitHub.

  Scope: the "Foundation release" feature set from the BookTranslationLab
  technical specification (spec sections 1–17, pages 91–129).

  CONFIGURE BEFORE DEPLOYING
    1. Replace FIREBASE_CONFIG placeholders below (search: YOUR_API_KEY).
    2. Set ORG_ID to the Firestore organization document ID.
    3. Publish the Firestore + Storage rules shown on the in-app Setup page.
    4. Bootstrap the organization doc and your admin membership (Setup page).
    Until configured, the app runs in Demo mode (browser-local sample data).

  CHANGELOG
    v1.0 (2026-11-07) — Initial release
      • Email/password sign-in, password reset, email verification, sign-out
      • Membership-based roles (admin / reviewer), account activation toggle
      • Authors, books (multi-book), translation projects (multi-language)
      • Manual chapter management with ordering and per-reviewer status
      • Reviewer 1 / Reviewer 2 assignment (reviewer1Id, reviewer2Id,
        assignedReviewerIds array for array-contains queries)
      • Review issues: reviewer submission, own-edit, admin resolution
      • Project glossary management (read-only for reviewers)
      • Manuscript uploads to Firebase Storage (DOCX/PDF/EPUB/TXT/MD, 25 MB)
        with version records; authenticated downloads (no public URLs)
      • Activity logging, admin activity log viewer
      • Setup page: Firestore/Storage rules, indexes, firebase.json, CORS,
        bootstrap docs, acceptance-test checklist, session error log
      • Demo mode with sample data and simulated permission checks
      • Sortable table columns, responsive layout, light/dark themes
    Not included (deferred): AI/DeepL translation, extraction, chapter
      splitting, side-by-side editor, quality scoring, EPUB generation, n8n.
================================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="1.0">
<title>BookTranslationLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --surface-2:#f0ebe3; --ink:#1d2433; --ink-2:#3c4458;
  --muted:#6e6a63; --line:#e2dbd0; --line-2:#cfc6b8;
  --accent:#b8432f; --accent-ink:#ffffff; --accent-soft:#f6e1da;
  --ok:#2f7a4f; --ok-soft:#e0f0e5; --warn:#a86a12; --warn-soft:#f8ecd4;
  --bad:#b3261e; --bad-soft:#f9dedb; --info:#2b5c9e; --info-soft:#dfe8f5;
  --shadow:0 1px 2px rgba(29,36,51,.06),0 8px 24px rgba(29,36,51,.06);
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171e; --surface:#1c2029; --surface-2:#232835; --ink:#ece7df; --ink-2:#c9c3b8;
    --muted:#9a948a; --line:#2e3442; --line-2:#3d4455;
    --accent:#e2735c; --accent-ink:#1a1310; --accent-soft:#3a2420;
    --ok:#6cc08d; --ok-soft:#1d3327; --warn:#e0a94f; --warn-soft:#3a2d17;
    --bad:#f08178; --bad-soft:#3d2120; --info:#86aee6; --info-soft:#1e2a3d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14171e; --surface:#1c2029; --surface-2:#232835; --ink:#ece7df; --ink-2:#c9c3b8;
  --muted:#9a948a; --line:#2e3442; --line-2:#3d4455;
  --accent:#e2735c; --accent-ink:#1a1310; --accent-soft:#3a2420;
  --ok:#6cc08d; --ok-soft:#1d3327; --warn:#e0a94f; --warn-soft:#3a2d17;
  --bad:#f08178; --bad-soft:#3d2120; --info:#86aee6; --info-soft:#1e2a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.2} h2{font-size:20px} h3{font-size:16px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink-2)}
label.f .help{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:84px;resize:vertical}
input[type=file]{font-size:13px}

/* ---------- login / gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:30px 28px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:17px;flex:none}
.brand-name{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand-ver{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gate-card form{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.gate-sub{color:var(--muted);font-size:14px;margin-top:14px}
.demo-users{display:grid;gap:8px;margin-top:18px}
.demo-users .btn{justify-content:space-between}
.demo-users .btn small{color:var(--muted);font-weight:400}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .n{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--muted)}
.nav svg{width:16px;height:16px;flex:none;opacity:.8}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;font-size:13px}
.who{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.who b{font-weight:600}
.who span{color:var(--muted);font-size:12px;word-break:break-all}
.main-wrap{min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.banner{padding:9px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.banner.demo{background:var(--info-soft);color:var(--info)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
main{padding:28px 32px 60px;max-width:1280px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}

/* ---------- cards / stats ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card + .card{margin-top:16px}
.grid > .card + .card{margin-top:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;margin-top:4px}
.stat .s{font-size:12px;color:var(--muted)}
dl.meta{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 18px;margin:0;font-size:14px}
dl.meta dt{color:var(--muted)}
dl.meta dd{margin:0;word-break:break-word}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.note b{color:var(--ink)}
.progress{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--ok);border-radius:99px}
.proj-card{display:flex;flex-direction:column;gap:10px}
.proj-card h3 a{color:var(--ink);text-decoration:none}
.proj-card h3 a:hover{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- chips ---------- */
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.th-sort{background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
.th-sort .ar{font-size:10px;opacity:.45}
.th-sort.on .ar{opacity:1;color:var(--accent)}
td .t-title{font-weight:600}
td .t-sub{font-size:12.5px;color:var(--muted)}
td.act{white-space:nowrap;text-align:right}
td a.rowlink{color:var(--ink);font-weight:600;text-decoration:none}
td a.rowlink:hover{color:var(--accent);text-decoration:underline}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a .n{font-family:var(--mono);font-size:11px;margin-left:4px;color:var(--muted)}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,18,25,.5);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.modal{width:100%;max-width:640px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal-h{padding:18px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-b{padding:18px 22px;overflow-y:auto}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-err{color:var(--bad);font-size:13.5px;margin-top:12px;background:var(--bad-soft);padding:9px 12px;border-radius:8px}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:9px;font-size:14px;box-shadow:var(--shadow);animation:tin .18s ease-out}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.upbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:10px 14px;width:min(360px,calc(100vw - 32px));z-index:150;font-size:13px}
.upbar .progress{margin-top:6px}
.upbar .progress > i{background:var(--accent)}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55;max-height:520px;margin:0;white-space:pre}
.check-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.check-list li{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.check-list li:last-child{border-bottom:none}
.check-list input{margin-top:3px;accent-color:var(--accent)}
.check-list .exp{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.loading{padding:40px;text-align:center;color:var(--muted)}
.diff-box{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.diff-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin:12px 0 4px}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .topbar{display:flex}
  main{padding:20px 16px 60px}
  .g2,.g3,.g-dash{grid-template-columns:minmax(0,1fr)}
  .banner{display:block}
  .check-list .exp{white-space:normal;text-align:right}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
}
@media (max-width: 720px){
  .form-grid{grid-template-columns:1fr}
  .tbl-wrap.cards{border:none;background:transparent}
  .tbl-wrap.cards table,.tbl-wrap.cards tbody,.tbl-wrap.cards tr,.tbl-wrap.cards td{display:block;width:100%}
  .tbl-wrap.cards thead{display:none}
  .tbl-wrap.cards tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;padding:6px 0}
  .tbl-wrap.cards td{border:none;padding:5px 14px;display:flex;gap:12px;justify-content:space-between}
  .tbl-wrap.cards td::before{content:attr(data-label);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;flex:none}
  .tbl-wrap.cards td.act{justify-content:flex-end}
  .tbl-wrap.cards td.act::before{content:none}
  .tbl-wrap.cards td > .cv{text-align:right;min-width:0;overflow-wrap:anywhere}
  h1{font-size:24px}
  dl.meta{grid-template-columns:1fr}
  dl.meta dt{margin-top:6px}
}
</style>
</head>

<script type="text/plain" id="tpl-firestore-rules">rules_version = '2';
// BookTranslationLab v1.0 — firestore.rules
service cloud.firestore {
  match /databases/{database}/documents {

    function signedIn() { return request.auth != null; }
    function memberPath(orgId) {
      return /databases/$(database)/documents/organizations/$(orgId)/members/$(request.auth.uid);
    }
    function isMember(orgId) { return signedIn() && exists(memberPath(orgId)); }
    function member(orgId) { return get(memberPath(orgId)).data; }
    function isActiveMember(orgId) { return isMember(orgId) && member(orgId).status == 'active'; }
    function isAdmin(orgId) { return isActiveMember(orgId) && member(orgId).role == 'admin'; }

    function projectPath(orgId, projectId) {
      return /databases/$(database)/documents/organizations/$(orgId)/translationProjects/$(projectId);
    }
    function project(orgId, projectId) { return get(projectPath(orgId, projectId)).data; }
    function isReviewer1(orgId, projectId) {
      return isActiveMember(orgId) && exists(projectPath(orgId, projectId))
        && project(orgId, projectId).reviewer1Id == request.auth.uid;
    }
    function isReviewer2(orgId, projectId) {
      return isActiveMember(orgId) && exists(projectPath(orgId, projectId))
        && project(orgId, projectId).reviewer2Id == request.auth.uid;
    }
    function isAssignedReviewer(orgId, projectId) {
      return isReviewer1(orgId, projectId) || isReviewer2(orgId, projectId);
    }
    function onlyChanged(keys) {
      return request.resource.data.diff(resource.data).affectedKeys().hasOnly(keys);
    }
    function reviewStatus(v) {
      return v in ['pending', 'in_progress', 'approved', 'changes_requested'];
    }

    // ORGANIZATION (created manually in the console)
    match /organizations/{orgId} {
      allow read: if isActiveMember(orgId);
      allow update: if isAdmin(orgId);
      allow create, delete: if false;
    }

    // ORGANIZATION MEMBERS (doc ID = Firebase Auth UID)
    match /organizations/{orgId}/members/{userId} {
      allow read: if isAdmin(orgId) || (signedIn() && request.auth.uid == userId);
      allow create, update: if isAdmin(orgId)
        && request.resource.data.uid == userId
        && request.resource.data.role in ['admin', 'reviewer']
        && request.resource.data.status in ['active', 'inactive'];
      allow delete: if isAdmin(orgId) && request.auth.uid != userId;
    }

    // AUTHORS
    match /organizations/{orgId}/authors/{authorId} {
      allow read: if isActiveMember(orgId);
      allow write: if isAdmin(orgId);
    }

    // ORIGINAL BOOK RECORDS
    match /organizations/{orgId}/books/{bookId} {
      allow read: if isActiveMember(orgId);
      allow write: if isAdmin(orgId);
    }

    // TRANSLATION PROJECTS
    // Reviewers query with where('assignedReviewerIds','array-contains',uid).
    match /organizations/{orgId}/translationProjects/{projectId} {
      allow read: if isAdmin(orgId)
        || (isActiveMember(orgId) && request.auth.uid in resource.data.assignedReviewerIds);
      allow create, update, delete: if isAdmin(orgId);

      // CHAPTERS — admin controls content; each reviewer may set only their own status
      match /chapters/{chapterId} {
        allow read: if isAdmin(orgId) || isAssignedReviewer(orgId, projectId);
        allow create, delete: if isAdmin(orgId);
        allow update: if isAdmin(orgId)
          || (isReviewer1(orgId, projectId) && onlyChanged(['reviewer1Status', 'updatedAt'])
              && reviewStatus(request.resource.data.reviewer1Status))
          || (isReviewer2(orgId, projectId) && onlyChanged(['reviewer2Status', 'updatedAt'])
              && reviewStatus(request.resource.data.reviewer2Status));
      }

      // GLOSSARY
      match /glossary/{termId} {
        allow read: if isAdmin(orgId) || isAssignedReviewer(orgId, projectId);
        allow write: if isAdmin(orgId);
      }

      // REVIEW ISSUES
      match /reviewIssues/{issueId} {
        allow read: if isAdmin(orgId) || isAssignedReviewer(orgId, projectId);
        allow create: if (isAdmin(orgId) || isAssignedReviewer(orgId, projectId))
          && request.resource.data.reviewerId == request.auth.uid
          && request.resource.data.status == 'open';

<script type="text/plain" id="tpl-storage-rules">rules_version = '2';
// BookTranslationLab v1.0 — storage.rules
service firebase.storage {
  match /b/{bucket}/o {

    function signedIn() { return request.auth != null; }
    function memberPath(orgId) {
      return /databases/(default)/documents/organizations/$(orgId)/members/$(request.auth.uid);
    }
    function isActiveMember(orgId) {
      return signedIn()
        && firestore.exists(memberPath(orgId))
        && firestore.get(memberPath(orgId)).data.status == 'active';
    }
    function isAdmin(orgId) {
      return isActiveMember(orgId)
        && firestore.get(memberPath(orgId)).data.role == 'admin';
    }
    function isAssignedReviewer(orgId, projectId) {
      let project = firestore.get(
        /databases/(default)/documents/organizations/$(orgId)/translationProjects/$(projectId)
      ).data;
      return isActiveMember(orgId)
        && (project.reviewer1Id == request.auth.uid || project.reviewer2Id == request.auth.uid);
    }
    function validUpload() {
      return request.resource != null
        && request.resource.size < 25 * 1024 * 1024
        && request.resource.contentType in [
          'application/pdf',
          'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
          'application/epub+zip',
          'text/plain',
          'text/markdown'
        ];
    }

    // ORIGINAL MASTER MANUSCRIPTS — administrator only
    match /organizations/{orgId}/books/{bookId}/source/{fileName} {
      allow read: if isAdmin(orgId);
      allow create, update: if isAdmin(orgId) && validUpload();
      allow delete: if isAdmin(orgId);
    }

    // TRANSLATION PROJECT FILES
    // folders: source, ai_drafts, reviewer_1, reviewer_2, approved, exports
    match /organizations/{orgId}/translationProjects/{projectId}/{folder}/{fileName} {
      allow read: if isAdmin(orgId)
        || (folder != 'exports' && isAssignedReviewer(orgId, projectId));
      // Reviewer uploads are not enabled in this release.
      allow create, update: if isAdmin(orgId) && validUpload();
      allow delete: if isAdmin(orgId);
    }

    // DENY EVERYTHING ELSE
    match /{allPaths=**} {
      allow read, write: if false;
    }
  }
}

async function createFirebaseApi() {

  if (USE_EMULATORS) {
    AU.connectAuthEmulator(auth, 'http://127.0.0.1:9099');
    FS.connectFirestoreEmulator(db, '127.0.0.1', 8080);
    ST.connectStorageEmulator(st, '127.0.0.1', 9199);
  }
  const base = 'organizations/' + ORG_ID;
  const norm = s => ({ id: s.id, ...s.data() });
  const d = (col, id) => FS.doc(db, base + '/' + col + '/' + id);
  const mapUser = u => u ? { uid: u.uid, email: u.email, displayName: u.displayName, emailVerified: u.emailVerified } : null;
  return {
    mode: 'firebase',
    ts: () => FS.serverTimestamp(),
    onAuth: cb => AU.onAuthStateChanged(auth, u => cb(mapUser(u))),
    signIn: (email, pw) => AU.signInWithEmailAndPassword(auth, email, pw),
    signOut: () => AU.signOut(auth),
    reset: email => AU.sendPasswordResetEmail(auth, email),
    verify: () => AU.sendEmailVerification(auth.currentUser),
    async getOrg() { const s = await FS.getDoc(FS.doc(db, base)); return s.exists() ? norm(s) : null; },
    updateOrg: data => FS.updateDoc(FS.doc(db, base), data),
    async list(col, o = {}) {
      const c = [];
      if (o.where) c.push(FS.where(...o.where));
      if (o.orderBy) c.push(FS.orderBy(...o.orderBy));
      if (o.limit) c.push(FS.limit(o.limit));

    },
    async get(col, id) { const s = await FS.getDoc(d(col, id)); return s.exists() ? norm(s) : null; },
    async set(col, id, data) { await FS.setDoc(d(col, id), data); return id; },

    remove: (col, id) => FS.deleteDoc(d(col, id)),

}

    const m = col('members')[current.uid];

    if (!m || m.status !== 'active') deny();
    if (m.role === 'admin') return;
    const parts = c.split('/'), top = parts[0];
    if (top === 'activityLogs') { if (op === 'create' && data.userId === current.uid) return; deny(); }
    if (top === 'authors' || top === 'books') { if (op === 'read' || op === 'list') return; deny(); }
    if (top === 'org') { if (op === 'read') return; deny(); }
    if (top === 'translationProjects') {

    async upload(path, file, contentType, onProg) {
      fileGuard('write', path);
      if (!Object.values(FILE_TYPES).includes(contentType) || file.size >= MAX_UPLOAD) { const e = new Error('Rejected by storage rules'); e.code = 'storage/unauthorized'; throw e; }
      for (let i = 1; i <= 5; i++) { await tick(); onProg && onProg(i / 5); }
      files.set(path, file); return path;
    },
    async download(path) {
      fileGuard('read', path);
      if (files.has(path)) return files.get(path);
      return new Blob(['BookTranslationLab demo placeholder for ' + path + '\n\nDemo mode keeps uploaded files only for the current browser session.'], { type: 'text/plain' });
    },
    async removeFile(path) { fileGuard('write', path); files.delete(path); },
    resetDemo() { try { localStorage.removeItem(KEY); } catch { /* ignore */ } store = seedDemo(); save(); }
  };
}

async function boot() {
  applyTheme();

async function onAuthChange(user) {
  S.user = user; S.member = null; S.isAdmin = false; S.myProjects = [];
  if (!user) return showLogin();
  $('#root').innerHTML = '<div class="loading">Checking your access…</div>';
  try {
    const m = await api.get('members', user.uid);
    if (!m) return showGate('noaccess');
    if (m.status !== 'active') return showGate('inactive');
    S.member = m; S.isAdmin = m.role === 'admin';
    S.org = await api.getOrg().catch(e => { logError(e, 'org read'); return null; });
    if (!S.isAdmin) S.myProjects = await api.list('translationProjects', { where: ['assignedReviewerIds', 'array-contains', user.uid] });
    showShell(); route();
  } catch (e) {
    logError(e, 'membership');
    showGate('error', friendly(e));
  }
}

async function route() {
  if (!S.member) return;
  S.route = parseHash();
  const requested = location.hash;
  let v = S.route.view;
  if (!VIEWS[v] || (ADMIN_ONLY.includes(v) && !S.isAdmin)) { v = 'dashboard'; S.route = { view: v }; }

  window.scrollTo(0, 0);

function table(id, cols, rows, empty) {
  const st = S.sort[id] || {};
  let r = rows.slice();
  if (st.key) {
    const c = cols.find(x => x.key === st.key);
    if (c) { const get = c.sort || (x => x[c.key]); r.sort((a, b) => cmp(get(a), get(b)) * st.dir); }
  }
  const head = cols.map(c => {
    if (c.nosort) return '<th>' + esc(c.label) + '</th>';
    const on = st.key === c.key, ar = on ? (st.dir > 0 ? '▲' : '▼') : '↕';
    return '<th><button class="th-sort' + (on ? ' on' : '') + '" data-act="sort" data-table="' + id + '" data-key="' + c.key + '">' + esc(c.label) + ' <span class="ar">' + ar + '</span></button></th>';
  }).join('');
  if (!r.length) return '<div class="tbl-wrap"><div class="empty">' + (empty || 'Nothing here yet.') + '</div></div>';
  const body = r.map(x => '<tr>' + cols.map(c => '<td data-label="' + esc(c.label) + '"' + (c.cls ? ' class="' + c.cls + '"' : '') + '><div class="cv">' + (c.render ? c.render(x) : esc(x[c.key] ?? '')) + '</div></td>').join('') + '</tr>').join('');
  return '<div class="tbl-wrap cards"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function fieldHtml(f) {
  const v = f.value ?? '';
  const req = f.required ? ' required' : '';
  const dis = f.disabled ? ' disabled' : '';
  let input;
  if (f.type === 'select') {
    input = '<select name="' + f.name + '"' + req + dis + '>' + opts(f.options).map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + (o[2] ? ' disabled' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  } else if (f.type === 'textarea') {
    input = '<textarea name="' + f.name + '"' + req + dis + (f.rows ? ' rows="' + f.rows + '"' : '') + '>' + esc(v) + '</textarea>';
  } else if (f.type === 'file') {
    input = '<input type="file" name="' + f.name + '" accept=".docx,.pdf,.epub,.txt,.md"' + req + '>';
  } else {
    input = '<input type="' + (f.type || 'text') + '" name="' + f.name + '" value="' + esc(v) + '"' + req + dis + (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') + (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + '>';
  }
  return '<label class="f' + (f.full ? ' full' : '') + '">' + esc(f.label) + (f.required ? ' *' : '') + input + (f.help ? '<span class="help">' + esc(f.help) + '</span>' : '') + '</label>';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openForm({ title, fields, submitLabel = 'Save', onSubmit, intro, wide }) {
  const body = '<form id="mform" novalidate><div class="modal-b">' + (intro ? '<div class="note" style="margin-bottom:14px">' + intro + '</div>' : '') +
    '<div class="form-grid">' + fields.map(fieldHtml).join('') + '</div><div id="mform-err" class="form-err hidden"></div></div>' +
    '<div class="modal-f"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn primary">' + esc(submitLabel) + '</button></div></form>';
  const m = modal(title, body, '', wide);
  const form = $('#mform', m);
  const first = form.querySelector('input:not([type=file]):not([disabled]),select:not([disabled]),textarea'); if (first) first.focus();
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = $('#mform-err'), btn = form.querySelector('button[type=submit]');
    err.classList.add('hidden');
    const vals = {};
    for (const f of fields) {
      const el = form.elements[f.name]; if (!el) continue;
      if (f.type === 'file') vals[f.name] = el.files[0] || null;
      else if (f.type === 'number') vals[f.name] = el.value === '' ? null : Number(el.value);
      else vals[f.name] = typeof el.value === 'string' ? el.value.trim() : el.value;
      if (f.required && (vals[f.name] == null || vals[f.name] === '')) { err.textContent = f.label + ' is required.'; err.classList.remove('hidden'); el.focus(); return; }
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    try { await onSubmit(vals); closeModal(); }
    catch (e) { logError(e, 'form: ' + title); err.textContent = friendly(e); err.classList.remove('hidden'); btn.disabled = false; btn.textContent = submitLabel; }
  });
}

function confirmBox(title, msg, okLabel = 'Delete') {
  return new Promise(res => {
    const m = modal(title, '<div class="modal-b"><p style="margin:0">' + msg + '</p></div>', '<div class="modal-f"><button class="btn" id="cf-no">Cancel</button><button class="btn primary" id="cf-yes">' + esc(okLabel) + '</button></div>');
    $('#cf-no', m).onclick = () => { closeModal(); res(false); };
    $('#cf-yes', m).onclick = () => { closeModal(); res(true); };
  });
}

/* ---------- files ---------- */
function validateFile(file) {
  if (!file) throw new AppError('Choose a file to upload.');
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!FILE_TYPES[ext]) throw new AppError('Unsupported file type ".' + ext + '". Allowed: DOCX, PDF, EPUB, TXT, MD.', 'unsupported');
  if (file.size >= MAX_UPLOAD) throw new AppError('File is ' + fmtBytes(file.size) + '. The upload limit is 25 MB.', 'oversized');
  if (file.size === 0) throw new AppError('The file is empty.');
  return { ext, contentType: FILE_TYPES[ext] };
}
async function uploadWithProgress(path, file, contentType) {
  const bar = document.createElement('div'); bar.className = 'upbar';
  bar.innerHTML = '<div>Uploading <b>' + esc(file.name) + '</b> <span id="up-pct">0%</span></div><div class="progress"><i style="width:0%"></i></div>';
  document.body.appendChild(bar);
  try {
    await api.upload(path, file, contentType, p => { const pct = Math.round(p * 100) + '%'; bar.querySelector('i').style.width = pct; const s = bar.querySelector('#up-pct'); if (s) s.textContent = pct; });
  } finally { bar.remove(); }
}
async function downloadFile(path, name) {
  try {
    toast('Preparing download…');
    const blob = await api.download(path);
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name || path.split('/').pop(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { fail(e, 'download ' + path); }
}

const P = pid => 'translationProjects/' + pid;
async function loadProjectBundle(pid) {
  const project = await api.get('translationProjects', pid);
  if (!project) throw new AppError('This translation project does not exist.', 'not-found');
  const [chapters, issues, glossary, versions, book] = await Promise.all([
    api.list(P(pid) + '/chapters', { orderBy: ['sortOrder', 'asc'] }),
    api.list(P(pid) + '/reviewIssues'),
    api.list(P(pid) + '/glossary'),
    api.list(P(pid) + '/versions'),
    api.get('books', project.bookId).catch(() => null)
  ]);
  return { project, chapters, issues, glossary, versions, book };
}
async function visibleProjects() {
  return S.isAdmin ? api.list('translationProjects') : api.list('translationProjects', { where: ['assignedReviewerIds', 'array-contains', S.user.uid] });
}
const myRole = p => !p ? null : p.reviewer1Id === S.user.uid ? 'reviewer1' : p.reviewer2Id === S.user.uid ? 'reviewer2' : null;
const authorName = a => a ? ((a.firstName || '') + ' ' + (a.lastName || '')).trim() : '—';
function completion(chs) { if (!chs.length) return 0; return Math.round(chs.filter(c => c.finalApprovalStatus === 'approved' || c.status === 'approved').length / chs.length * 100); }
function reviewerCompletion(chs, role) { if (!chs.length) return 0; const k = role === 'reviewer2' ? 'reviewer2Status' : 'reviewer1Status'; return Math.round(chs.filter(c => c[k] === 'approved').length / chs.length * 100); }
const progressBar = pct => '<div class="progress" title="' + pct + '%"><i style="width:' + pct + '%"></i></div>';

async function moveChapter(pid, id, dir) {
  const chs = (S.vd && S.vd.chapters) || await api.list(P(pid) + '/chapters', { orderBy: ['sortOrder', 'asc'] });
  const i = chs.findIndex(c => c.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= chs.length) return;
  const a = chs[i], b = chs[j];
  let sa = Number(a.sortOrder), sb = Number(b.sortOrder);
  if (sa === sb) { sa = i + 1; sb = j + 1; }
  await Promise.all([api.update(P(pid) + '/chapters', a.id, { sortOrder: sb, updatedAt: api.ts() }), api.update(P(pid) + '/chapters', b.id, { sortOrder: sa, updatedAt: api.ts() })]);
  await logActivity('chapter_reordered', 'Moved "' + a.chapterTitle + '" ' + (dir < 0 ? 'up' : 'down'), { projectId: pid, chapterId: a.id });
  refresh();
}

      { name: 'suggestedCorrection', label: 'Suggested correction', type: 'textarea', required: true, full: true, value: i.suggestedCorrection },
      { name: 'notes', label: 'Notes', type: 'textarea', full: true, value: i.notes },
      { name: 'status', label: 'Status', type: 'select', options: [['open', 'Open'], ['withdrawn', 'Withdrawn']], value: i.status }
    ],
    async onSubmit(v) {
      await api.update(P(pid) + '/reviewIssues', id, { ...v, updatedAt: api.ts() });
      await logActivity('issue_updated', 'Updated correction in "' + i.chapterTitle + '"', { projectId: pid, chapterId: i.chapterId });
      toast('Correction updated', 'ok'); refresh();
    }
  });
}
async function resolveIssueForm(pid, id) {
  const i = await api.get(P(pid) + '/reviewIssues', id);
  openForm({
    title: 'Resolve issue',
    fields: [
      { name: 'status', label: 'Resolution', type: 'select', options: ISSUE_STATUS, value: i.status === 'open' ? 'resolved' : i.status, full: true },
      { name: 'adminNotes', label: 'Resolution notes', type: 'textarea', full: true, value: i.adminNotes }
    ],
    async onSubmit(v) {
      const closed = ['resolved', 'rejected', 'accepted'].includes(v.status);
      await api.update(P(pid) + '/reviewIssues', id, { ...v, resolvedAt: closed ? api.ts() : null, resolvedBy: closed ? S.user.uid : '', updatedAt: api.ts() });
      await logActivity('issue_resolved', 'Marked issue in "' + i.chapterTitle + '" as ' + v.status, { projectId: pid, chapterId: i.chapterId });
      toast('Issue updated', 'ok'); refresh();
    }
  });
}

async function termForm(pid, id) {
  const projects = pid ? null : await api.list('translationProjects');
  if (!pid && !projects.length) { toast('Create a translation project first.', 'bad'); return; }
  const g = id ? await api.get(P(pid) + '/glossary', id) : null;
  openForm({
    title: id ? 'Edit glossary term' : 'Add glossary term',
    fields: [
      ...(pid ? [] : [{ name: 'projectId', label: 'Project', type: 'select', required: true, options: projects.map(p => [p.id, p.projectName + ' (' + p.targetVariant + ')']), full: true }]),
      { name: 'sourceTerm', label: 'Source term', required: true, value: g && g.sourceTerm },
      { name: 'targetTerm', label: 'Target term', required: true, value: g && g.targetTerm },
      { name: 'context', label: 'Context', value: g && g.context },
      { name: 'approvalStatus', label: 'Approval status', type: 'select', options: GLOSSARY_STATUS, value: g ? g.approvalStatus : 'approved' },
      { name: 'usageNotes', label: 'Usage notes', type: 'textarea', full: true, value: g && g.usageNotes }
    ],
    async onSubmit(v) {
      const projectId = pid || v.projectId; delete v.projectId;
      const proj = (projects || []).find(p => p.id === projectId) || (S.vd && S.vd.project) || {};
      const approvedBy = v.approvalStatus === 'approved' ? S.user.uid : '';
      if (g) await api.update(P(projectId) + '/glossary', id, { ...v, approvedBy, updatedAt: api.ts() });
      else await api.set(P(projectId) + '/glossary', uuid(), { ...v, approvedBy, bookId: proj.bookId || '', projectId, createdAt: api.ts(), updatedAt: api.ts() });
      await logActivity(g ? 'glossary_term_updated' : 'glossary_term_created', (g ? 'Updated' : 'Added') + ' glossary term "' + v.sourceTerm + '" → "' + v.targetTerm + '"', { projectId });
      toast('Glossary saved', 'ok'); refresh();
    }
  });
}

async function uploadFileForm(pid) {
  const [p, chs, vers] = await Promise.all([api.get('translationProjects', pid), api.list(P(pid) + '/chapters', { orderBy: ['sortOrder', 'asc'] }), api.list(P(pid) + '/versions')]);
  openForm({
    title: 'Upload project file',
    intro: 'Files are stored at <span class="mono">translationProjects/' + esc(pid.slice(0, 8)) + '…/{folder}/</span>. Allowed: DOCX, PDF, EPUB, TXT, MD — up to 25 MB. Uploading the same chapter + version to the same folder replaces the file.',
    fields: [
      { name: 'folder', label: 'Folder', type: 'select', options: FOLDERS.map(f => [f[0], f[1]]), value: 'source' },
      { name: 'chapterId', label: 'Chapter', type: 'select', options: [['', '— Whole manuscript / none —'], ...chs.map(c => [c.id, c.chapterNumber + '. ' + c.chapterTitle])] },
      { name: 'versionNumber', label: 'Version', value: '0.1.0', required: true, help: 'Semantic version, e.g. 0.1.0 draft, 0.2.0 Reviewer 1, 1.0.0 approved' },
      { name: 'description', label: 'Description', placeholder: 'e.g. Initial reviewer corrections' },
      { name: 'file', label: 'File', type: 'file', required: true, full: true }
    ],
    submitLabel: 'Upload',
    async onSubmit(v) {
      const { ext, contentType } = validateFile(v.file);
      if (!/^\d+\.\d+\.\d+$/.test(v.versionNumber)) throw new AppError('Version must look like 0.1.0');
      const ch = chs.find(c => c.id === v.chapterId), folder = FOLDERS.find(f => f[0] === v.folder);
      const fileName = ch
        ? 'chapter_' + pad3(ch.chapterNumber) + (v.folder === 'source' ? '' : '_v' + v.versionNumber) + '.' + ext
        : slug(v.file.name) + '_v' + v.versionNumber + '.' + ext;
      const path = 'organizations/' + ORG_ID + '/translationProjects/' + pid + '/' + v.folder + '/' + fileName;
      await uploadWithProgress(path, v.file, contentType);
      const existing = vers.find(x => x.storagePath === path);
      const rec = { bookId: p.bookId, projectId: pid, chapterId: v.chapterId || '', folder: v.folder, versionNumber: v.versionNumber, versionType: folder[2], storagePath: path, fileName, originalName: v.file.name, contentType, size: v.file.size, description: v.description, createdBy: S.user.uid, createdByName: S.member.displayName || S.user.email, createdAt: api.ts() };
      await api.set(P(pid) + '/versions', existing ? existing.id : uuid(), rec);
      if (ch) {
        const patch = v.folder === 'source' ? { sourceFilePath: path } : v.folder !== 'exports' ? { translationFilePath: path } : null;
        if (patch) await api.update(P(pid) + '/chapters', ch.id, { ...patch, updatedAt: api.ts() });
      }
      await logActivity('file_uploaded', 'Uploaded ' + fileName + ' to ' + v.folder, { projectId: pid, chapterId: v.chapterId, bookId: p.bookId });
      toast('File uploaded', 'ok'); refresh();
    }
  });
}

async function memberForm(id) {
  const m = id ? await api.get('members', id) : null;
  openForm({
    title: id ? 'Edit member' : 'Add member',
    intro: id ? '' : 'Paste the <b>User UID</b> from Firebase Console → Authentication. The membership document ID will be that UID.',
    fields: [
      { name: 'uid', label: 'User UID', required: true, full: true, value: m ? m.uid : '', disabled: !!m },
      { name: 'displayName', label: 'Display name', required: true, value: m && m.displayName },
      { name: 'email', label: 'Email', type: 'email', required: true, value: m && m.email },
      { name: 'role', label: 'Role', type: 'select', options: [['reviewer', 'Reviewer'], ['admin', 'Administrator']], value: m ? m.role : 'reviewer' },
      { name: 'status', label: 'Status', type: 'select', options: [['active', 'Active'], ['inactive', 'Inactive']], value: m ? m.status : 'active' }
    ],
    async onSubmit(v) {
      const uid = m ? m.uid : v.uid;
      if (!/^[A-Za-z0-9_-]{6,128}$/.test(uid)) throw new AppError('That does not look like a Firebase UID.');
      if (!m && await api.get('members', uid)) throw new AppError('A member with this UID already exists.');
      const data = { uid, displayName: v.displayName, email: v.email, role: v.role, status: v.status, updatedAt: api.ts(), createdAt: m ? m.createdAt : api.ts() };
      await api.set('members', uid, data);
      await logActivity(m ? 'member_updated' : 'member_added', (m ? 'Updated' : 'Added') + ' member ' + v.displayName + ' (' + v.role + ', ' + v.status + ')');
      toast(m ? 'Member updated' : 'Member added', 'ok'); refresh();
    }
  });
}

async function orgForm() {
  const o = S.org || {};
  openForm({
    title: 'Organization settings',
    fields: [
      { name: 'name', label: 'Organization name', required: true, full: true, value: o.name },
      { name: 'defaultLanguage', label: 'Default source language', type: 'select', options: SOURCE_LANGS, value: o.defaultLanguage || 'en' },
      { name: 'defaultSpanishVariant', label: 'Default target variant', type: 'select', options: VARIANTS, value: (o.settings || {}).defaultSpanishVariant || 'es-419' }
    ],
    async onSubmit(v) {
      const settings = { defaultTargetLanguage: v.defaultSpanishVariant.split('-')[0], defaultSpanishVariant: v.defaultSpanishVariant };
      await api.updateOrg({ name: v.name, defaultLanguage: v.defaultLanguage, settings });
      S.org = { ...o, name: v.name, defaultLanguage: v.defaultLanguage, settings };
      await logActivity('organization_updated', 'Updated organization settings');
      toast('Organization saved', 'ok'); renderNav(); refresh();
    }
  });
}

/* ---------- action dispatcher ---------- */
const ACT = {
  'reload': () => location.reload(),
  'force-demo': () => { sessionStorage.setItem('btl_force_demo', '1'); location.reload(); },
  'exit-demo': () => { sessionStorage.removeItem('btl_force_demo'); location.reload(); },
  'demo-login': d => api.signIn(d.uid),
  'reset-demo': async () => { if (await confirmBox('Reset demo data', 'Replace all demo records in this browser with the original sample data?', 'Reset')) { api.resetDemo(); toast('Demo data reset', 'ok'); } },
  'reset-pw': async () => {
    const email = ($('#login-form') && $('#login-form').elements.email.value.trim()) || '';
    openForm({ title: 'Reset password', fields: [{ name: 'email', label: 'Account email', type: 'email', required: true, value: email, full: true }], submitLabel: 'Send reset link',
      async onSubmit(v) { await api.reset(v.email); toast('If that account exists, a reset link is on its way.', 'ok'); } });
  },
  'verify': async () => { await api.verify(); toast('Verification email sent', 'ok'); },
  'signout': async () => { await api.signOut(); location.hash = ''; },
  'theme': () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    ls.set('btl_theme', cur === 'dark' ? 'light' : 'dark'); applyTheme();
  },
  'side': () => { S.sideOpen = !S.sideOpen; renderNav(); },
  'changelog': () => modal('About BookTranslationLab', '<div class="modal-b"><p class="small muted" style="margin-top:0">Version ' + APP.version + ' · build ' + APP.build + ' · mode: ' + api.mode + ' · org: <span class="mono">' + esc(ORG_ID) + '</span></p>' + changelogHtml() + '</div>'),
  'close-modal': () => closeModal(),
  'sort': d => { const s = S.sort[d.table] || {}; S.sort[d.table] = { key: d.key, dir: s.key === d.key ? -s.dir : 1 }; rerender(); },
  'copy': async d => { try { await navigator.clipboard.writeText(d.text); toast('Copied', 'ok'); } catch { toast('Copy failed — select the text manually.', 'bad'); } },
  'copy-tpl': async d => { try { await navigator.clipboard.writeText(tplText(d.tpl)); toast('Copied', 'ok'); } catch { toast('Copy failed — select the text manually.', 'bad'); } },
  'save-tpl': d => { const blob = new Blob([tplText(d.tpl) + '\n'], { type: 'text/plain' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = d.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); },
  'reset-check': d => { ls.set(d.key, {}); S.member ? rerender() : showSetupPublic(); },
  'clear-errors': () => { errorLog.length = 0; ls.set('btl_error_log', []); S.member ? rerender() : showSetupPublic(); },
  'dl': d => downloadFile(d.path),
  'new-book': () => bookForm(),
  'edit-book': d => bookForm(d.id),
  'del-book': async d => {
    const projects = await api.list('translationProjects', { where: ['bookId', '==', d.id] });
    if (projects.length) { toast('This book has ' + projects.length + ' translation project(s). Delete or archive those first.', 'bad'); return; }
    const b = await api.get('books', d.id);
    if (!await confirmBox('Delete book', 'Delete <b>' + esc(b.title) + '</b> and its uploaded manuscript? This cannot be undone.')) return;
    if (b.sourceFilePath) await api.removeFile(b.sourceFilePath);
    await api.remove('books', d.id);
    await logActivity('book_deleted', 'Deleted book "' + b.title + '"', { bookId: d.id });
    toast('Book deleted', 'ok'); go('books');
  },
  'book-upload': d => openForm({
    title: 'Upload original manuscript', submitLabel: 'Upload',
    intro: 'Stored privately at <span class="mono">books/…/source/original.{ext}</span>. Replacing overwrites the current master file of the same format.',
    fields: [{ name: 'file', label: 'Manuscript file', type: 'file', required: true, full: true, help: 'DOCX, PDF, EPUB, TXT or MD — up to 25 MB' }],
    async onSubmit(v) { const b = await api.get('books', d.id); await uploadBookSource(d.id, v.file, b && b.title); toast('Manuscript uploaded', 'ok'); refresh(); }
  }),
  'new-author': () => authorForm(),
  'edit-author': d => authorForm(d.id),
  'del-author': async d => {
    const books = await api.list('books', { where: ['authorId', '==', d.id] });
    if (books.length) { toast('This author is linked to ' + books.length + ' book(s). Reassign them first.', 'bad'); return; }
    const a = await api.get('authors', d.id);
    if (!await confirmBox('Delete author', 'Delete <b>' + esc(authorName(a)) + '</b>?')) return;
    await api.remove('authors', d.id); await logActivity('author_deleted', 'Deleted author ' + authorName(a));
    toast('Author deleted', 'ok'); refresh();
  },
  'new-project': d => projectForm(null, d.book),
  'edit-project': d => projectForm(d.id),
  'assign': d => assignForm(d.id),
  'del-project': async d => {
    const b = S.vd;
    if (b.chapters.length || b.issues.length || b.glossary.length || b.versions.length) { toast('Remove this project’s chapters, issues, glossary terms and files first — or set its status to Archived.', 'bad'); return; }
    if (!await confirmBox('Delete project', 'Delete <b>' + esc(b.project.projectName) + '</b>?')) return;
    await api.remove('translationProjects', d.id);
    await logActivity('project_deleted', 'Deleted project "' + b.project.projectName + '"', { projectId: d.id, bookId: b.project.bookId });
    toast('Project deleted', 'ok'); go('projects');
  },
  'new-chapter': d => chapterForm(d.pid),
  'edit-chapter': d => chapterForm(d.pid, d.id),
  'ch-move': d => moveChapter(d.pid, d.id, Number(d.dir)),
  'del-chapter': async d => {
    const c = S.vd.chapters.find(x => x.id === d.id);
    const linked = S.vd.issues.filter(i => i.chapterId === d.id).length;
    if (!await confirmBox('Delete chapter', 'Delete chapter <b>' + esc(c.chapterTitle) + '</b>?' + (linked ? ' It has ' + linked + ' review issue(s), which will remain but lose their chapter link.' : '') + ' Uploaded files are kept in Files &amp; versions.')) return;
    await api.remove(P(d.pid) + '/chapters', d.id);
    await logActivity('chapter_deleted', 'Deleted chapter "' + c.chapterTitle + '"', { projectId: d.pid, chapterId: d.id });
    toast('Chapter deleted', 'ok'); refresh();
  },
  'rev-status': d => reviewerStatusForm(d.pid, d.id),
  'new-issue': d => issueForm(d.pid, d.ch),
  'view-issue': d => viewIssue(d.pid, d.id),
  'edit-issue': d => editIssueForm(d.pid, d.id),
  'resolve-issue': d => resolveIssueForm(d.pid, d.id),
  'del-issue': async d => {
    closeModal();
    if (!await confirmBox('Delete issue', 'Permanently delete this review issue?')) return;
    await api.remove(P(d.pid) + '/reviewIssues', d.id);
    await logActivity('issue_deleted', 'Deleted a review issue', { projectId: d.pid });
    toast('Issue deleted', 'ok'); refresh();
  },
  'new-term': d => termForm(d.pid),
  'edit-term': d => termForm(d.pid, d.id),
  'del-term': async d => {
    if (!await confirmBox('Delete term', 'Delete this glossary term?')) return;
    await api.remove(P(d.pid) + '/glossary', d.id);
    await logActivity('glossary_term_deleted', 'Deleted a glossary term', { projectId: d.pid });
    toast('Term deleted', 'ok'); refresh();
  },
  'upload-file': d => uploadFileForm(d.pid),
  'del-file': async d => {
    const v = S.vd.versions.find(x => x.id === d.id);
    if (!await confirmBox('Delete file', 'Delete <b>' + esc(v.fileName) + '</b> from Storage and remove its version record?')) return;
    await api.removeFile(v.storagePath);
    await api.remove(P(d.pid) + '/versions', d.id);
    const ch = S.vd.chapters.find(c => c.id === v.chapterId);
    if (ch) {
      const patch = {};
      if (ch.sourceFilePath === v.storagePath) patch.sourceFilePath = '';
      if (ch.translationFilePath === v.storagePath) patch.translationFilePath = '';
      if (Object.keys(patch).length) await api.update(P(d.pid) + '/chapters', ch.id, { ...patch, updatedAt: api.ts() });
    }
    await logActivity('file_deleted', 'Deleted ' + v.fileName, { projectId: d.pid, chapterId: v.chapterId });
    toast('File deleted', 'ok'); refresh();
  },
  'new-member': () => memberForm(),
  'edit-member': d => memberForm(d.id),
  'toggle-member': async d => {
    const m = await api.get('members', d.id);
    const status = m.status === 'active' ? 'inactive' : 'active';
    await api.update('members', d.id, { status, updatedAt: api.ts() });
    await logActivity('member_updated', (status === 'active' ? 'Activated ' : 'Deactivated ') + m.displayName);
    toast(m.displayName + (status === 'active' ? ' activated' : ' deactivated'), 'ok'); refresh();
  },
  'del-member': async d => {
    const m = await api.get('members', d.id);
    if (!await confirmBox('Remove member', 'Remove <b>' + esc(m.displayName) + '</b> from the organization? Their Firebase Auth account is not deleted, but they lose all access. Projects they are assigned to will need a new reviewer.', 'Remove')) return;
    await api.remove('members', d.id);
    await logActivity('member_deleted', 'Removed member ' + m.displayName);
    toast('Member removed', 'ok'); refresh();
  },
  'edit-org': () => orgForm()
};

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (ev.target.id === 'scrim' && S.sideOpen) { S.sideOpen = false; renderNav(); return; }
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  ev.preventDefault();
  try { await fn({ ...el.dataset }); } catch (e) { fail(e, el.dataset.act); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.search) {
    S.filter[el.dataset.search] = el.value;
    const v = VIEWS[S.route.view], wrap = $('#tblwrap');
    if (wrap && S.vd) {
      if (v && v.tbl) wrap.innerHTML = v.tbl(S.vd);
      else if (S.route.view === 'project') { const q = el.value.toLowerCase(); wrap.innerHTML = glossTable(S.vd.glossary.filter(g => !q || [g.sourceTerm, g.targetTerm, g.context].join(' ').toLowerCase().includes(q)), false); }
    }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.filter) { S.filter[el.dataset.filter] = el.value; rerender(); }
  if (el.dataset.check) { const st = ls.get(el.dataset.check, {}); st[el.dataset.i] = el.checked; ls.set(el.dataset.check, st); S.member ? rerender() : showSetupPublic(); }
});
window.addEventListener('hashchange', () => { if (!S.user && parseHash().view === 'setup') showSetupPublic(); else if (!S.user && api) showLogin(); });

// Expose a tiny debug handle for testing in the console.
window.BTL = { APP, get mode() { return api && api.mode; }, state: S };

boot();
</script>
